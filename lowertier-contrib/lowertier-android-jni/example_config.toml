# LowTier Android JNI 示例配置文件
# 这是一个基本的配置示例，展示如何配置 LowTier 网络实例

# 实例名称 (必需)
inst_name = "android_instance"

# 网络名称 (必需)
network = "my_lowertier_network"

# 网络密钥 (可选，用于网络加密)
# network_secret = "your_secret_key_here"

# 监听地址 (可选)
# listeners = ["tcp://0.0.0.0:11010", "udp://0.0.0.0:11010"]

# 对等节点地址 (可选)
# peers = ["tcp://peer1.example.com:11010", "udp://peer2.example.com:11010"]

# 虚拟 IP 地址 (可选)
# ipv4 = "10.144.144.1"

# 主机名 (可选)
# hostname = "android-device"

# 启用 IPv6 (可选)
# ipv6 = "fd00::1"

# 代理网络 (可选)
# proxy_networks = ["192.168.1.0/24"]

# 退出节点 (可选)
# exit_nodes = ["peer1"]

# 启用加密 (可选)
# enable_encryption = true

# 启用 IPv4 转发 (可选)
# enable_ipv4 = true

# 启用 IPv6 转发 (可选)
# enable_ipv6 = false

# MTU 设置 (可选)
# mtu = 1420

# 日志级别 (可选: error, warn, info, debug, trace)
# log_level = "info"

# 严格模式只允许使用 IP 字面量的对等节点和 STUN 地址，并禁用 HTTP/HTTPS/TXT/SRV 对等节点发现。
# stun_servers = ["192.0.2.20:3478"]
# stun_servers_v6 = ["[2001:db8::20]:3478"]

[flags]

# 严格禁止 LowTier 底层连接使用指定接口或地址范围。CIDR 同时匹配本地源地址和远程目标地址。
# underlay_deny_interfaces = ["tailscale0"]
# underlay_deny_cidrs = ["100.64.0.0/10", "fd7a:115c:a1e0::/48"]

# QUIC 默认使用 BBR。Brutal 使用固定发送速率，必须按真实可用带宽保守设置。
# quic_congestion = "brutal"
# quic_brutal_send_bps = 50000000
# quic_brutal_loss_compensation = true
# quic_initial_receive_window = 8388608
# quic_receive_window = 33554432

# 禁用 P2P (可选)
# disable_p2p = false

# 使用多路径 (可选)
# use_multi_path = true

# 延迟优先 (可选)
# latency_first = false
