[package]
name = "lowertier-ffi"
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
default = ["c-abi", "ffi-dataplane", "core-default"]
c-abi = []
core-default = ["lowertier/default"]
ffi-dataplane = ["lowertier/ffi-dataplane"]
packet-tunnel = ["lowertier/packet-tunnel", "lowertier/socks5", "dep:toml", "dep:futures"]

[dependencies]
lowertier = { path = "../../lowertier", default-features = false }
toml = { version = "0.8.12", optional = true }
futures = { version = "0.3", optional = true }

once_cell = "1.18.0"
dashmap = "6.0"
tokio = { version = "1", features = ["rt-multi-thread", "io-util", "time", "sync", "macros"] }
async-trait = "0.1"
log = "0.4"
percent-encoding = "2.3"
url = "2"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
uuid = "1.17.0"
tokio-util = "0.7"
