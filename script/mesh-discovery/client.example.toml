# This configuration uses local test services. Set actual addresses and explicit ports before deployment.
# Each node needs its own VPN address.
# Start it with: lowertier run -c client.example.toml

[node]
hostname = "rendezvous-client-a"

[network]
name = "local-rendezvous-test"
secret = "replace-with-a-random-shared-secret"

[address]
ipv4 = "10.216.0.1/24"

[tun]
name = "rv0"
ipv6 = true

[transport]
listen = []
prefer = "quic"

[nat]
stun = ["127.0.0.1:16780", "127.0.0.1:16781"]
stun_tcp = ["127.0.0.1:16780", "127.0.0.1:16781"]

[discovery]
trackers = [
  "udp://127.0.0.1:16969/announce",
  "udp://[::1]:16969/announce",
  "http://127.0.0.1:16969/announce",
  "http://[::1]:16969/announce",
]
# Omit bind to discover through every permitted interface.
private_trackers = [
  "udp://127.0.0.1:16969/announce",
  "udp://[::1]:16969/announce",
  "http://127.0.0.1:16969/announce",
  "http://[::1]:16969/announce",
]
# Use explicit endpoints when a fixed local port is required.
# bind = "127.0.0.1:17001"
# advertise = "127.0.0.1:17001"

[control]
# The local management portal used by `lowertier status` and `lowertier top`.
portal = "127.0.0.1:15888"
