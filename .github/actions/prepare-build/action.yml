name: prepare-lowertier-build
author: lowertier
description: Prepare the lowertier CLI build environment
inputs:
  target:
    description: The Rust target
    required: false
  token:
    description: The GitHub token for protocol compiler downloads
    required: false
  rustflags:
    description: The release compiler flags
    required: false
    default: ""
  components:
    description: The Rust toolchain components
    required: false
    default: ""
  install_musl:
    description: Install the Linux musl compiler tools
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - name: Install Linux musl tools
      if: runner.os == 'Linux' && inputs.install_musl == 'true'
      run: |
        sudo apt-get update
        sudo apt-get install -qqy musl-tools
      shell: bash

    - name: Set up protocol compiler
      uses: arduino/setup-protoc@v3
      with:
        version: "35.1"
        repo-token: ${{ inputs.token }}

    - name: Verify protocol compiler
      run: test "$(protoc --version | tr -d '\r')" = "libprotoc 35.1"
      shell: bash

    - name: Set up Rust
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: "1.95"
        target: ${{ inputs.target }}
        components: ${{ inputs.components }}
        cache: false

    - name: Set release compiler flags
      if: inputs.rustflags != ''
      run: echo "RUSTFLAGS=${{ inputs.rustflags }} --remap-path-prefix=$GITHUB_WORKSPACE=." >> "$GITHUB_ENV"
      shell: bash
