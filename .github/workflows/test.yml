name: lowertier test

on:
  push:
    branches: ["main"]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "lowertier/**"
      - "vendor/**"
      - ".github/actions/prepare-build/**"
      - ".github/workflows/test.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "lowertier/**"
      - "vendor/**"
      - ".github/actions/prepare-build/**"
      - ".github/workflows/test.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Format, lint, and validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Prepare build environment
        uses: ./.github/actions/prepare-build
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          components: rustfmt,clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check lints
        run: >-
          cargo clippy --locked --package lowertier --all-targets
          --no-default-features --features lean -- -D warnings

      - name: Check lock file
        run: cargo metadata --format-version 1 --locked > /dev/null

  tests:
    name: Test CLI and network behavior
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Prepare build environment
        uses: ./.github/actions/prepare-build
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Install network test tools
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            bridge-utils \
            iptables \
            miniupnpd \
            miniupnpd-iptables

      - name: Prepare network test system
        run: |
          sudo modprobe br_netfilter
          sudo sysctl net.bridge.bridge-nf-call-iptables=0
          sudo sysctl net.bridge.bridge-nf-call-ip6tables=0
          sudo sysctl net.ipv6.conf.lo.disable_ipv6=0
          sudo ip addr add 2001:db8::2/64 dev lo

      - name: Install nextest
        uses: taiki-e/install-action@nextest

      - name: Run unit and component tests
        run: >-
          sudo -E env "PATH=$PATH" cargo nextest run --locked
          --package lowertier --no-default-features --features lean
          -E 'not test(tests::three_node)'
          --test-threads 1 --no-fail-fast

      - name: Run three-node tests
        run: >-
          sudo -E env "PATH=$PATH" cargo nextest run --locked
          --package lowertier --no-default-features --features lean
          -E 'test(tests::three_node) and not test(subnet_proxy_three_node_test)'
          --test-threads 1 --no-fail-fast

      - name: Run subnet proxy tests
        run: >-
          sudo -E env "PATH=$PATH" cargo nextest run --locked
          --package lowertier --no-default-features --features lean
          -E 'test(subnet_proxy_three_node_test)'
          --test-threads 1 --no-fail-fast
