name: lowertier test

on:
  push:
    branches: ["main"]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "lowertier/**"
      - "lowertier-tracker/**"
      - "vendor/**"
      - "script/**/*.py"
      - "pyrightconfig.json"
      - ".github/actions/prepare-build/**"
      - ".github/workflows/test.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "lowertier/**"
      - "lowertier-tracker/**"
      - "vendor/**"
      - "script/**/*.py"
      - "pyrightconfig.json"
      - ".github/actions/prepare-build/**"
      - ".github/workflows/test.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  tests:
    name: Build once and run essential tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Type-check Python scripts
        run: npx --yes pyright@1.1.413

      - name: Test Python scripts
        run: python3 -m unittest discover -s script/tests -p "*test*.py" -v

      - name: Prepare build environment
        uses: ./.github/actions/prepare-build
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          components: rustfmt

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check lock file
        run: cargo metadata --format-version 1 --locked > /dev/null

      - name: Install network test tools
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            bridge-utils \
            iproute2 \
            iputils-ping

      - name: Prepare network test system
        run: |
          sudo modprobe br_netfilter
          sudo sysctl net.bridge.bridge-nf-call-iptables=0
          sudo sysctl net.bridge.bridge-nf-call-ip6tables=0
          sudo sysctl net.ipv6.conf.lo.disable_ipv6=0
          sudo ip addr add 2001:db8::2/64 dev lo

      - name: Install nextest
        uses: taiki-e/install-action@nextest

      - name: Enforce core test budget
        run: |
          test_count="$(grep -R -E '^[[:space:]]*#\[(tokio::)?test' lowertier/src lowertier-tracker/src vendor/quincy-tun/src | wc -l)"
          echo "Core tests: $test_count / 500"
          test "$test_count" -le 500

      - name: Build test archive
        run: >-
          cargo nextest archive --locked
          --package lowertier --package lowertier-tracker --features lowertier-tracker/server --package quincy-tun
          --archive-file "$RUNNER_TEMP/lowertier-tests.tar.zst"

      - name: Run essential tests
        run: >-
          sudo -E env "PATH=$PATH" cargo nextest run
          --archive-file "$RUNNER_TEMP/lowertier-tests.tar.zst"
          --test-threads 1 --no-fail-fast
