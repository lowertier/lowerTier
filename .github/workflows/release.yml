name: lowertier release

on:
  workflow_dispatch:
    inputs:
      core_run_id:
        description: "The successful lowertier core run ID"
        type: number
        required: true
      version:
        description: "The release version"
        type: string
        default: "v2.6.4"
        required: true
      make_latest:
        description: "Mark this release as latest"
        type: boolean
        default: true
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Package CLI release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download core artifacts
        uses: dawidd6/action-download-artifact@v11
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          run_id: ${{ inputs.core_run_id }}
          repo: ${{ github.repository }}
          path: release-assets

      - name: Create release archives
        env:
          VERSION: ${{ inputs.version }}
        run: |
          mkdir -p zipped-assets
          while IFS= read -r -d '' artifact_dir; do
            artifact_name="$(basename "$artifact_dir")"
            archive="$GITHUB_WORKSPACE/zipped-assets/${artifact_name}-${VERSION}.zip"
            (cd "$artifact_dir" && zip -r "$archive" .)
          done < <(find release-assets -mindepth 1 -maxdepth 1 -type d -print0)
          test -n "$(find zipped-assets -type f -name '*.zip' -print -quit)"

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ inputs.version }}
          draft: true
          make_latest: ${{ inputs.make_latest }}
          files: zipped-assets/*
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ inputs.version }}
