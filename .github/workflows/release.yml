name: lowertier release

on:
  push:
    tags: ["v*-lowertier.*"]
  workflow_dispatch:
    inputs:
      core_run_id:
        description: "The successful lowertier core run ID"
        type: number
        required: true
      version:
        description: "The release version"
        type: string
        default: "v2.6.4"
        required: true
      make_latest:
        description: "Mark this release as latest"
        type: boolean
        default: true
        required: true

permissions:
  actions: read
  contents: write

jobs:
  release:
    name: Package CLI release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download selected core artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: dawidd6/action-download-artifact@v11
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          run_id: ${{ inputs.core_run_id }}
          repo: ${{ github.repository }}
          path: release-assets

      - name: Download latest core artifacts
        if: github.event_name == 'push'
        uses: dawidd6/action-download-artifact@v11
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: core.yml
          workflow_conclusion: success
          branch: main
          event: push
          check_artifacts: true
          repo: ${{ github.repository }}
          path: release-assets

      - name: Create release archives
        env:
          VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
        run: |
          mkdir -p zipped-assets
          while IFS= read -r -d '' artifact_dir; do
            artifact_name="$(basename "$artifact_dir")"
            archive="$GITHUB_WORKSPACE/zipped-assets/${artifact_name}-${VERSION}.zip"
            (cd "$artifact_dir" && zip -r "$archive" .)
          done < <(find release-assets -mindepth 1 -maxdepth 1 -type d -print0)
          test -n "$(find zipped-assets -type f -name '*.zip' -print -quit)"
          (cd zipped-assets && sha256sum ./*.zip > SHA256SUMS)

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
          body: |
            This release contains only the lean lowertier command-line programs.

            Each archive contains `lowertier-core` and `lowertier-cli`.
            Windows archives also contain required driver files.
            Verify each archive with `SHA256SUMS`.
          draft: false
          prerelease: false
          make_latest: ${{ github.event_name == 'push' || inputs.make_latest }}
          fail_on_unmatched_files: true
          files: zipped-assets/*
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
