name: lowertier core

on:
  push:
    branches: ["main", "releases/**"]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "lowertier/**"
      - "vendor/**"
      - ".github/actions/prepare-build/**"
      - ".github/workflows/core.yml"
  pull_request:
    branches: ["main"]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "lowertier/**"
      - "vendor/**"
      - ".github/actions/prepare-build/**"
      - ".github/workflows/core.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  build:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
            artifact: linux-x86_64
            rustflags: -C force-unwind-tables=no
            install_musl: "true"
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            artifact: linux-aarch64
            rustflags: -C force-unwind-tables=no
            install_musl: "true"
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: macos-x86_64
            rustflags: -C force-unwind-tables=no
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: macos-aarch64
            rustflags: -C force-unwind-tables=no
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: windows-x86_64
            rustflags: -C target-feature=+crt-static -C force-unwind-tables=no
          - target: aarch64-pc-windows-msvc
            os: windows-11-arm
            artifact: windows-aarch64
            rustflags: -C target-feature=+crt-static -C force-unwind-tables=no

    name: Build ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      TARGET: ${{ matrix.target }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Prepare build environment
        uses: ./.github/actions/prepare-build
        with:
          target: ${{ matrix.target }}
          token: ${{ secrets.GITHUB_TOKEN }}
          rustflags: ${{ matrix.rustflags }}
          install_musl: ${{ matrix.install_musl || 'false' }}

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: core-${{ matrix.target }}
          cache-targets: false

      - name: Build CLI binaries
        run: >-
          cargo build --locked --release --target "$TARGET"
          --package lowertier --bins --no-default-features
          --features lean

      - name: Collect binaries
        run: |
          mkdir -p artifacts
          suffix=""
          if [[ "$TARGET" == *windows* ]]; then
            suffix=".exe"
          fi
          cp "target/$TARGET/release/lowertier-core$suffix" artifacts/
          cp "target/$TARGET/release/lowertier-cli$suffix" artifacts/

          if [[ "$TARGET" == *windows* ]]; then
            arch_dir="x86_64"
            if [[ "$TARGET" == aarch64* ]]; then
              arch_dir="arm64"
            fi
            find "lowertier/third_party/$arch_dir" -maxdepth 1 -type f \
              \( -name "*.dll" -o -name "*.sys" \) \
              -exec cp {} artifacts/ \;
          fi

      - name: Upload binaries
        uses: actions/upload-artifact@v5
        with:
          name: lowertier-${{ matrix.artifact }}
          path: artifacts/*
          if-no-files-found: error
