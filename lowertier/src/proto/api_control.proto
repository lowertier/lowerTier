syntax = "proto3";

import "api_instance.proto";
import "peer_rpc.proto";
import "common.proto";
import "acl.proto";

package api.control.v1;

message RequestMeta {
  string instance_id = 1;
  string control_token = 2;
  string admin_token = 3;
  string request_id = 4;
}

message ApiError {
  string code = 1;
  string message = 2;
  string field_path = 3;
  bool retryable = 4;
}

message Page {
  uint32 limit = 1;
  string page_token = 2;
}

message SnapshotMeta {
  uint64 revision = 1;
  uint64 topology_generation = 2;
  int64 sampled_at_unix_ms = 3;
}

message GetCapabilitiesRequest { RequestMeta meta = 1; }

message GetCapabilitiesResponse {
  ApiError error = 1;
  string api_version = 2;
  repeated string methods = 3;
  uint32 max_page_size = 4;
  uint32 max_watch_wait_ms = 5;
  repeated string apply_classes = 6;
  repeated string resources = 7;
}

message ListInstancesRequest { RequestMeta meta = 1; }
message InstanceSnapshot {
  string instance_id = 1;
  string name = 2;
  string network_name = 3;
  bool running = 4;
  string last_error = 5;
}
message ListInstancesResponse { ApiError error = 1; repeated InstanceSnapshot instances = 2; }

message GetNodeRequest { RequestMeta meta = 1; }
message GetNodeResponse { ApiError error = 1; SnapshotMeta snapshot = 2; api.instance.NodeInfo node = 3; }

message PeerSnapshot {
  bytes peer_key = 1;
  uint32 peer_id = 2;
  repeated uint32 path_peer_ids = 3;
  repeated api.instance.PeerConnInfo conns = 4;
  common.NatType udp_nat = 5;
  common.NatType tcp_nat = 6;
  optional uint64 rtt_us = 7;
  optional uint32 loss_ppm = 8;
  optional uint64 delivery_bps = 9;
  optional uint64 sample_age_ms = 10;
  string metric_scope = 11;
  api.instance.Route route = 12;
  optional uint64 sample_expiry_ms = 13;
  // Authentication from an active direct transport connection, if present.
  optional peer_rpc.SecureAuthLevel direct_link_auth = 14;
  // A committed, valid data-plane session with a bound Noise static peer key.
  // Absent means no end-to-end session is currently established.
  optional bool end_to_end_session_ready = 15;
  // Local routing attestation, distinct from transport/session authentication.
  optional peer_rpc.SecureAuthLevel routing_authority_auth = 16;
}
message ListPeersRequest { RequestMeta meta = 1; Page page = 2; }
message ListPeersResponse {
  ApiError error = 1;
  SnapshotMeta snapshot = 2;
  repeated PeerSnapshot peers = 3;
  string next_page_token = 4;
}

message RouteSnapshot {
  string destination = 1;
  repeated uint32 path_peer_ids = 2;
  string policy = 3;
  string effective_policy = 4;
  string source = 5;
  optional uint64 measured_rtt_us = 6;
  optional uint64 cost_ms = 7;
  optional uint64 delivery_bps = 8;
  string override_status = 9;
  api.instance.Route route = 10;
  string path_error = 11;
  string control_policy = 12;
  string fallback_reason = 13;
  uint32 first_hop_peer_id = 14;
  uint32 final_gateway_peer_id = 15;
  bytes peer_key = 16;
  string override_inactive_reason = 17;
}
message ListRoutesRequest { RequestMeta meta = 1; Page page = 2; bool include_paths = 3; }
message ListRoutesResponse {
  ApiError error = 1;
  SnapshotMeta snapshot = 2;
  repeated RouteSnapshot routes = 3;
  string next_page_token = 4;
}

message FdbEntry {
  repeated uint32 vlans = 1;
  bytes mac = 2;
  uint32 owner_peer = 3;
  uint64 age_ms = 4;
}
message L2Counters {
  uint64 flood_drops = 1;
  uint64 ingress_flood_drops = 2;
  uint64 loop_drops = 3;
  uint64 policy_drops = 4;
}
message GetL2Request { RequestMeta meta = 1; Page page = 2; }
message GetL2Response {
  ApiError error = 1;
  SnapshotMeta snapshot = 2;
  repeated FdbEntry fdb = 3;
  L2Counters counters = 4;
  string next_page_token = 5;
}

message Observation {
  string protocol = 1;
  string socket = 2;
  string observer = 3;
  string endpoint = 4;
  uint64 age_ms = 5;
  optional int64 expires_at_unix_ms = 6;
  bool provisional = 7;
}
message TrackerSnapshot { string uri = 1; string last_error = 2; optional uint32 candidate_count = 3; }
message GetDiscoveryRequest { RequestMeta meta = 1; }
message GetDiscoveryResponse {
  ApiError error = 1;
  SnapshotMeta snapshot = 2;
  repeated TrackerSnapshot trackers = 3;
  repeated Observation observations = 4;
  optional uint32 candidate_count = 5;
  repeated string active_paths = 6;
  string last_error = 7;
}

message ListenerSnapshot {
  string id = 1;
  string uri = 2;
  string transport = 3;
  uint32 lanes = 4;
  string auth_state = 5;
  string binding_kind = 6;
  uint64 config_revision = 7;
  string configured_path = 8;
}
message ListListenersRequest { RequestMeta meta = 1; }
message ListListenersResponse { ApiError error = 1; SnapshotMeta snapshot = 2; repeated ListenerSnapshot listeners = 3; }

message GetStatsRequest { RequestMeta meta = 1; }
message GetStatsResponse { ApiError error = 1; SnapshotMeta snapshot = 2; repeated api.instance.MetricSnapshot metrics = 3; }
message GetPrometheusRequest { RequestMeta meta = 1; }
message GetPrometheusResponse { ApiError error = 1; SnapshotMeta snapshot = 2; string text = 3; }

message ReadLogsRequest { RequestMeta meta = 1; Page page = 2; }
message LogEntry { uint64 sequence = 1; int64 sampled_at_unix_ms = 2; string level = 3; string target = 4; string message = 5; }
message ReadLogsResponse { ApiError error = 1; repeated LogEntry logs = 2; string next_page_token = 3; uint64 truncated = 4; }
message GetLogConfigRequest { RequestMeta meta = 1; }
message GetLogConfigResponse { ApiError error = 1; string level = 2; }
message SetLogConfigRequest { RequestMeta meta = 1; string level = 2; }
message SetLogConfigResponse { ApiError error = 1; }

message GetAclRequest { RequestMeta meta = 1; }
message GetAclResponse { ApiError error = 1; SnapshotMeta snapshot = 2; acl.Acl acl = 3; repeated string tcp_whitelist = 4; repeated string udp_whitelist = 5; }
message GetAclStatsRequest { RequestMeta meta = 1; }
message GetAclStatsResponse { ApiError error = 1; SnapshotMeta snapshot = 2; acl.AclStats stats = 3; }
message ListCredentialsRequest { RequestMeta meta = 1; Page page = 2; }
message ListCredentialsResponse { ApiError error = 1; SnapshotMeta snapshot = 2; repeated api.instance.CredentialInfo credentials = 3; string next_page_token = 4; }
message IssueCredentialRequest {
  RequestMeta meta = 1;
  repeated string groups = 2;
  bool allow_relay = 3;
  repeated string allowed_proxy_cidrs = 4;
  int64 ttl_seconds = 5;
  optional string credential_id = 6;
  optional bool reusable = 7;
}
message IssueCredentialResponse { ApiError error = 1; string credential_id = 2; string credential_secret = 3; }
message RevokeCredentialRequest { RequestMeta meta = 1; string credential_id = 2; }
message RevokeCredentialResponse { ApiError error = 1; bool revoked = 2; }

message ListPortForwardsRequest { RequestMeta meta = 1; }
message ListPortForwardsResponse { ApiError error = 1; SnapshotMeta snapshot = 2; repeated common.PortForwardConfigPb port_forwards = 3; }

message ControlConfig { optional string token_file = 1; }
message IdentityConfig { optional string network_name = 1; optional string network_secret = 2; }
message PeerConfig { string uri = 1; optional string peer_public_key = 2; }
message ProxyNetworkConfig { string cidr = 1; optional string mapped_cidr = 2; repeated string allow = 3; }
message ForwardConfig { string bind_addr = 1; string dst_addr = 2; string proto = 3; }
message DiscoveryConfig { repeated string trackers = 1; repeated string private_trackers = 2; optional string bind = 3; optional string advertise = 4; }
message NodeConfig {
  common.RelayConfig relay = 1;
  common.CamouflageConfig camouflage = 2;
  common.LimitsConfig limits = 3;
  DiscoveryConfig discovery = 4;
  optional string netns = 5;
  optional string hostname = 6;
  optional string instance_name = 7;
  optional string instance_id = 8;
  optional string ipv4 = 9;
  optional string ipv6 = 10;
  optional bool ipv6_public_addr_provider = 11;
  optional bool ipv6_public_addr_auto = 12;
  optional string ipv6_public_addr_prefix = 13;
  optional bool dhcp = 14;
  IdentityConfig network_identity = 15;
  repeated string listeners = 16;
  repeated string mapped_listeners = 17;
  repeated string exit_nodes = 18;
  repeated PeerConfig peer = 19;
  repeated ProxyNetworkConfig proxy_network = 20;
  repeated string routes = 21;
  optional string socks5_proxy = 22;
  optional string outbound_http_proxy = 23;
  repeated ForwardConfig port_forward = 24;
  common.SecureModeConfig secure_mode = 25;
  common.FlagsInConfig flags = 26;
  acl.Acl acl = 27;
  repeated string tcp_whitelist = 28;
  repeated string udp_whitelist = 29;
  repeated string stun_servers = 30;
  repeated string tcp_stun_servers = 31;
  repeated string stun_servers_v6 = 32;
  optional string credential_file = 33;
  ControlConfig control = 34;
}
message ConfigPatch {
  uint64 expected_revision = 1;
  repeated string field_mask = 2;
  NodeConfig values = 3;
  repeated string clear_paths = 4;
  bool persist = 5;
  bool stage = 6;
}
message ApplyResult {
  uint64 revision = 1;
  repeated string live_fields = 2;
  repeated string new_connection_fields = 3;
  repeated string restart_fields = 4;
  repeated ApiError errors = 5;
}
message GetConfigRequest { RequestMeta meta = 1; }
message GetConfigResponse { ApiError error = 1; SnapshotMeta snapshot = 2; NodeConfig desired = 3; NodeConfig active = 4; repeated string restart_fields = 5; }
message ValidateConfigRequest { RequestMeta meta = 1; ConfigPatch patch = 2; }
message ValidateConfigResponse { ApiError error = 1; ApplyResult result = 2; }
message PatchConfigRequest { RequestMeta meta = 1; ConfigPatch patch = 2; }
message PatchConfigResponse { ApiError error = 1; ApplyResult result = 2; }
message GetRelayRequest { RequestMeta meta = 1; }
message GetRelayResponse {
  ApiError error = 1;
  SnapshotMeta snapshot = 2;
  common.RelayConfig config = 3;
  uint64 total_bytes = 4;
  repeated api.instance.MetricSnapshot counters = 5;
  string desired_permission = 6;
  string advertised_permission = 7;
  repeated string drop_reasons = 8;
  repeated RouteSnapshot paths = 9;
}
message GetCamouflageRequest { RequestMeta meta = 1; }
message GetCamouflageResponse {
  ApiError error = 1;
  SnapshotMeta snapshot = 2;
  common.CamouflageConfig config = 3;
  string certificate_source = 4;
  string quic_h2_verification = 5;
  string direct_wss_verification = 6;
  string cdn_outer_verification = 7;
  string cdn_inner_verification = 8;
}
message CreateInstanceRequest { RequestMeta meta = 1; NodeConfig config = 2; }
message CreateInstanceResponse { ApiError error = 1; string instance_id = 2; ApplyResult result = 3; }
message StartInstanceRequest { RequestMeta meta = 1; }
message StartInstanceResponse { ApiError error = 1; ApplyResult result = 2; }
message StopInstanceRequest { RequestMeta meta = 1; }
message StopInstanceResponse { ApiError error = 1; }
message DeleteInstanceRequest { RequestMeta meta = 1; }
message DeleteInstanceResponse { ApiError error = 1; }
message SetAclRequest { RequestMeta meta = 1; uint64 expected_revision = 2; acl.Acl acl = 3; repeated string tcp_whitelist = 4; repeated string udp_whitelist = 5; bool persist = 6; }
message SetAclResponse { ApiError error = 1; ApplyResult result = 2; }
message PutPortForwardRequest { RequestMeta meta = 1; uint64 expected_revision = 2; ForwardConfig port_forward = 3; bool persist = 4; bool stage = 5; }
message PutPortForwardResponse { ApiError error = 1; ApplyResult result = 2; }
message DeletePortForwardRequest { RequestMeta meta = 1; uint64 expected_revision = 2; string bind_addr = 3; string proto = 4; bool persist = 5; bool stage = 6; }
message DeletePortForwardResponse { ApiError error = 1; ApplyResult result = 2; }

message WatchChangesRequest {
  RequestMeta meta = 1;
  repeated string resources = 2;
  string cursor = 3;
  uint32 max_wait_ms = 4;
}
message WatchChangesResponse { ApiError error = 1; string cursor = 2; repeated string changed = 3; bool reset = 4; }

service ControlPlaneV1Rpc {
  rpc GetCapabilities(GetCapabilitiesRequest) returns (GetCapabilitiesResponse);
  rpc ListInstances(ListInstancesRequest) returns (ListInstancesResponse);
  rpc GetNode(GetNodeRequest) returns (GetNodeResponse);
  rpc ListPeers(ListPeersRequest) returns (ListPeersResponse);
  rpc ListRoutes(ListRoutesRequest) returns (ListRoutesResponse);
  rpc GetL2(GetL2Request) returns (GetL2Response);
  rpc GetDiscovery(GetDiscoveryRequest) returns (GetDiscoveryResponse);
  rpc ListListeners(ListListenersRequest) returns (ListListenersResponse);
  rpc GetStats(GetStatsRequest) returns (GetStatsResponse);
  rpc GetPrometheus(GetPrometheusRequest) returns (GetPrometheusResponse);
  rpc ReadLogs(ReadLogsRequest) returns (ReadLogsResponse);
  rpc GetLogConfig(GetLogConfigRequest) returns (GetLogConfigResponse);
  rpc SetLogConfig(SetLogConfigRequest) returns (SetLogConfigResponse);
  rpc GetAcl(GetAclRequest) returns (GetAclResponse);
  rpc GetAclStats(GetAclStatsRequest) returns (GetAclStatsResponse);
  rpc ListCredentials(ListCredentialsRequest) returns (ListCredentialsResponse);
  rpc IssueCredential(IssueCredentialRequest) returns (IssueCredentialResponse);
  rpc RevokeCredential(RevokeCredentialRequest) returns (RevokeCredentialResponse);
  rpc ListPortForwards(ListPortForwardsRequest) returns (ListPortForwardsResponse);
  rpc WatchChanges(WatchChangesRequest) returns (WatchChangesResponse);
  rpc GetConfig(GetConfigRequest) returns (GetConfigResponse);
  rpc ValidateConfig(ValidateConfigRequest) returns (ValidateConfigResponse);
  rpc PatchConfig(PatchConfigRequest) returns (PatchConfigResponse);
  rpc GetRelay(GetRelayRequest) returns (GetRelayResponse);
  rpc GetCamouflage(GetCamouflageRequest) returns (GetCamouflageResponse);
  rpc CreateInstance(CreateInstanceRequest) returns (CreateInstanceResponse);
  rpc StartInstance(StartInstanceRequest) returns (StartInstanceResponse);
  rpc StopInstance(StopInstanceRequest) returns (StopInstanceResponse);
  rpc DeleteInstance(DeleteInstanceRequest) returns (DeleteInstanceResponse);
  rpc SetAcl(SetAclRequest) returns (SetAclResponse);
  rpc PutPortForward(PutPortForwardRequest) returns (PutPortForwardResponse);
  rpc DeletePortForward(DeletePortForwardRequest) returns (DeletePortForwardResponse);
}
