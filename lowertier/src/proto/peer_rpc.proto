syntax = "proto3";

import "google/protobuf/timestamp.proto";
import "common.proto";

package peer_rpc;

message TrustedCredentialPubkey {
  bytes pubkey = 1;              // X25519 public key (32 bytes)
  repeated string groups = 2;   // ACL groups this credential belongs to
  bool allow_relay = 3;         // whether this credential node can relay data
  int64 expiry_unix = 4;        // expiry time (Unix timestamp)
  repeated string allowed_proxy_cidrs = 5; // allowed proxy_cidrs ranges
  optional bool reusable = 6;   // whether multiple peers may use the same credential concurrently
  uint32 credential_version = 7;
  // Deprecated. New credentials use certificate_id.
  uint64 serial = 8 [deprecated = true];
  string network_name = 9;
  bytes root_public_key = 10;
  bytes root_fingerprint = 11;
  string role = 12;
  bytes certificate_signature = 13;
  CredentialCertificate certificate = 14;
  bytes certificate_id = 15;
}

message TrustedCredentialPubkeyProof {
  TrustedCredentialPubkey credential = 1;
  bytes credential_hmac = 2;
}

// Fields in this certificate are signed in protobuf field order.
message CredentialCertificate {
  uint32 version = 1;
  string network_name = 2;
  bytes root_public_key = 3;
  bytes root_fingerprint = 4;
  bytes subject_x25519_public_key = 5;
  // Deprecated. New credentials use certificate_id.
  uint64 serial = 6 [deprecated = true];
  int64 issued_unix = 7;
  int64 expiry_unix = 8;
  string role = 9;
  repeated string groups = 10;
  bool allow_relay = 11;
  repeated string allowed_proxy_cidrs = 12;
  bool reusable = 13;
  bytes signature = 14;
  bytes certificate_id = 15;
}

message CredentialBundle {
  uint32 version = 1;
  bytes x25519_private_key = 2;
  string network_name = 3;
  bytes root_public_key = 4;
  bytes root_fingerprint = 5;
  // Deprecated. New credentials use certificate_id.
  uint64 serial = 6 [deprecated = true];
  CredentialCertificate certificate = 7;
  int64 issued_unix = 8;
  int64 expiry_unix = 9;
  string role = 10;
  repeated string groups = 11;
  bool allow_relay = 12;
  repeated string allowed_proxy_cidrs = 13;
  bool reusable = 14;
  bytes certificate_id = 15;
}

message CredentialRevocationState {
  uint32 version = 1;
  string network_name = 2;
  bytes root_public_key = 3;
  bytes root_fingerprint = 4;
  uint64 state_version = 5;
  // Deprecated. New states use revoked_certificate_ids.
  repeated uint64 revoked_serials = 6 [deprecated = true];
  int64 issued_unix = 7;
  bytes signature = 8;
  repeated bytes revoked_certificate_ids = 9;
}

// A short-lived root-signed status assertion for one certificate.
message CredentialCertificateStatus {
  uint32 version = 1;
  string network_name = 2;
  bytes root_fingerprint = 3;
  bytes certificate_id = 4;
  uint64 sequence = 5;
  int64 issued_unix = 6;
  int64 not_after_unix = 7;
  bool revoked = 8;
  bytes signature = 9;
  bytes root_public_key = 10;
}

message RoutePeerInfo {
  // means next hop in route table.
  uint32 peer_id = 1;
  common.UUID inst_id = 2;
  uint32 cost = 3;
  optional common.Ipv4Addr ipv4_addr = 4;
  repeated string proxy_cidrs = 5;
  optional string hostname = 6;
  common.NatType udp_nat_type = 7;
  google.protobuf.Timestamp last_update = 8;
  uint32 version = 9;

  string lowertier_version = 10;
  common.PeerFeatureFlag feature_flag = 11;
  uint64 peer_route_id = 12;

  uint32 network_length = 13;

  optional uint32 quic_port = 14 [deprecated = true];
  optional common.Ipv6Inet ipv6_addr = 15;

  repeated PeerGroupInfo groups = 16;

  common.NatType tcp_nat_type = 17;
  bytes noise_static_pubkey = 18;

  // Trusted credential public keys published by admin nodes (holding network_secret)
  repeated TrustedCredentialPubkeyProof trusted_credential_pubkeys = 19;

  optional common.Ipv6Inet ipv6_public_addr_prefix = 22;
  optional common.Ipv6Inet ipv6_public_addr_lease = 24;
  // Each item contains one IPv4 or IPv6 multicast address in network order.
  repeated bytes multicast_groups = 25;
  PeerIdentityType identity_type = 26;

  // HMAC proof for an Admin node that can receive complete Ethernet frames.
  bytes bridge_attestation_hmac = 27;
  uint64 bridge_attestation_issued_unix_ms = 28;
  uint64 bridge_attestation_expiry_unix_ms = 29;
}

message PeerIdVersion {
  uint32 peer_id = 1;
  uint32 version = 2;
}

message RouteConnBitmap {
  repeated PeerIdVersion peer_ids = 1;
  bytes bitmap = 2;
}

message RouteConnPeerList {
  message PeerConnInfo {
    PeerIdVersion peer_id = 1;
    repeated uint32 connected_peer_ids = 2;
  }
  repeated PeerConnInfo peer_conn_infos = 1;
}

message RoutePeerInfos { repeated RoutePeerInfo items = 1; }

message ForeignNetworkRouteInfoKey {
  uint32 peer_id = 1;
  string network_name = 2;
}

message ForeignNetworkRouteInfoEntry {
  repeated uint32 foreign_peer_ids = 1;
  google.protobuf.Timestamp last_update = 2;
  uint32 version = 3;
  bytes network_secret_digest = 4;
  uint32 my_peer_id_for_this_network = 5;
  bytes owner_noise_static_pubkey = 6;
}

message RouteForeignNetworkInfos {
  message Info {
    ForeignNetworkRouteInfoKey key = 1;
    ForeignNetworkRouteInfoEntry value = 2;
  }
  repeated Info infos = 1;
}

message RouteForeignNetworkSummary {
  message Info {
    uint32 peer_id = 1;
    uint32 network_count = 2;
    uint32 peer_count = 3;
  }

  map<uint32, Info> info_map = 1;
}

message PeerGroupInfo {
  string group_name = 1;
  bytes group_proof = 2;
}

message SyncRouteInfoRequest {
  uint32 my_peer_id = 1;
  uint64 my_session_id = 2;
  bool is_initiator = 3;
  RoutePeerInfos peer_infos = 4;
  oneof conn_info {
    RouteConnBitmap conn_bitmap = 5;
    RouteConnPeerList conn_peer_list = 7;
  }
  RouteForeignNetworkInfos foreign_network_infos = 6;
}

enum SyncRouteInfoError {
  DuplicatePeerId = 0;
  Stopped = 1;
}

message SyncRouteInfoResponse {
  bool is_initiator = 1;
  uint64 session_id = 2;
  optional SyncRouteInfoError error = 3;
}

service OspfRouteRpc {
  // Generates a "hello" greeting based on the supplied info.
  rpc SyncRouteInfo(SyncRouteInfoRequest) returns (SyncRouteInfoResponse);
}

message AcquireIpv6PublicAddrLeaseRequest {
  uint32 peer_id = 1;
  common.UUID inst_id = 2;
}

message RenewIpv6PublicAddrLeaseRequest {
  uint32 peer_id = 1;
  common.UUID inst_id = 2;
  common.Ipv6Inet leased_addr = 3;
}

message ReleaseIpv6PublicAddrLeaseRequest {
  uint32 peer_id = 1;
  common.UUID inst_id = 2;
}

message GetIpv6PublicAddrLeaseRequest {
  uint32 peer_id = 1;
  common.UUID inst_id = 2;
}

message Ipv6PublicAddrLeaseReply {
  uint32 provider_peer_id = 1;
  common.UUID provider_inst_id = 2;
  common.Ipv6Inet provider_prefix = 3;
  common.Ipv6Inet leased_addr = 4;
  google.protobuf.Timestamp valid_until = 5;
  bool reused = 6;
  optional string error_msg = 7;
}

service PublicIpv6AddrRpc {
  rpc AcquireLease(AcquireIpv6PublicAddrLeaseRequest)
      returns (Ipv6PublicAddrLeaseReply);
  rpc RenewLease(RenewIpv6PublicAddrLeaseRequest)
      returns (Ipv6PublicAddrLeaseReply);
  rpc ReleaseLease(ReleaseIpv6PublicAddrLeaseRequest) returns (common.Void);
  rpc GetLease(GetIpv6PublicAddrLeaseRequest) returns (Ipv6PublicAddrLeaseReply);
}

message GetIpListRequest {}

message GetIpListResponse {
  common.Ipv4Addr public_ipv4 = 1;
  repeated common.Ipv4Addr interface_ipv4s = 2;
  common.Ipv6Addr public_ipv6 = 3;
  repeated common.Ipv6Addr interface_ipv6s = 4;
  repeated common.Url listeners = 5;
}

message SendUdpHolePunchPacketRequest {
  common.SocketAddr connector_addr = 1;
  uint32 listener_port = 2;
  common.Ipv6Addr preferred_src_ipv6 = 3;
  repeated common.SocketAddr connector_addrs = 4;
}

service DirectConnectorRpc {
  rpc GetIpList(GetIpListRequest) returns (GetIpListResponse);
  rpc SendUdpHolePunchPacket(SendUdpHolePunchPacketRequest) returns (common.Void);
}

message SelectPunchListenerRequest {
  bool force_new = 1;
  bool prefer_port_mapping = 2;
}

message SelectPunchListenerResponse {
  common.SocketAddr listener_mapped_addr = 1;
}

message SendPunchPacketConeRequest {
  common.SocketAddr listener_mapped_addr = 1;
  common.SocketAddr dest_addr = 2;
  uint32 transaction_id = 3;
  // send this many packets in a batch
  uint32 packet_count_per_batch = 4;
  // send total this batch count, total packet count = packet_batch_size * packet_batch_count
  uint32 packet_batch_count = 5;
  // interval between each batch
  uint32 packet_interval_ms = 6;
  // All server-reflexive candidates gathered from the same UDP socket.
  repeated common.SocketAddr dest_addrs = 7;
  // Short-lived 128-bit proof delivered over authenticated peer RPC.
  bytes auth_token = 8;
}

message SendPunchPacketHardSymRequest {
  common.SocketAddr listener_mapped_addr = 1;

  repeated common.Ipv4Addr public_ips = 2;
  uint32 transaction_id = 3;
  uint32 port_index = 4;
  uint32 round = 5;
}

message SendPunchPacketHardSymResponse { uint32 next_port_index = 1; }

message SendPunchPacketEasySymRequest {
  common.SocketAddr listener_mapped_addr = 1;
  repeated common.Ipv4Addr public_ips = 2;
  uint32 transaction_id = 3;

  uint32 base_port_num = 4;
  uint32 max_port_num = 5;
  bool is_incremental = 6;
}

message SendPunchPacketBothEasySymRequest {
  uint32 udp_socket_count = 1;
  common.Ipv4Addr public_ip = 2;
  uint32 transaction_id = 3;

  uint32 dst_port_num = 4;
  uint32 wait_time_ms = 5;
}

message SendPunchPacketBothEasySymResponse {
  // is doing punch with other peer
  bool is_busy = 1;
  common.SocketAddr base_mapped_addr = 2;
}

service UdpHolePunchRpc {
  rpc SelectPunchListener(SelectPunchListenerRequest)
      returns (SelectPunchListenerResponse);

  // send packet to one remote_addr, used by nat1-3 to nat1-3
  rpc SendPunchPacketCone(SendPunchPacketConeRequest) returns (common.Void);

  // send packet to multiple remote_addr (birthday attack), used by nat4 to nat1-3
  rpc SendPunchPacketHardSym(SendPunchPacketHardSymRequest)
      returns (SendPunchPacketHardSymResponse);
  rpc SendPunchPacketEasySym(SendPunchPacketEasySymRequest)
      returns (common.Void);

  // nat4 to nat4 (both predictably)
  rpc SendPunchPacketBothEasySym(SendPunchPacketBothEasySymRequest)
      returns (SendPunchPacketBothEasySymResponse);
}

message TcpHolePunchRequest { common.SocketAddr connector_mapped_addr = 1; }

message TcpHolePunchResponse { common.SocketAddr listener_mapped_addr = 1; }

service TcpHolePunchRpc {
  rpc ExchangeMappedAddr(TcpHolePunchRequest) returns (TcpHolePunchResponse);
}

message DirectConnectedPeerInfo {
  int32 latency_ms = 1;
  uint64 tx_delivery_bps = 2;
  uint32 tx_loss_ppm = 3;
  uint64 speed_sample_age_ms = 4;
  uint64 speed_sample_ttl_ms = 5;
  uint64 speed_probe_generation = 6;
}

message PeerInfoForGlobalMap {
  map<uint32, DirectConnectedPeerInfo> direct_peers = 1;
}

message ReportPeersRequest {
  uint32 my_peer_id = 1;
  PeerInfoForGlobalMap peer_infos = 2;
}

message ReportPeersResponse {}

message GlobalPeerMap { map<uint32, PeerInfoForGlobalMap> map = 1; }

message GetGlobalPeerMapRequest { uint64 digest = 1; }

message GetGlobalPeerMapResponse {
  map<uint32, PeerInfoForGlobalMap> global_peer_map = 1;
  optional uint64 digest = 2;
  repeated PeerCenterSourceDelta deltas = 3;
  bool full_snapshot = 4;
  uint64 snapshot_residence_age_ms = 5;
}

message PeerCenterSourceDelta {
  uint64 generation = 1;
  uint32 source_peer_id = 2;
  PeerInfoForGlobalMap peer_info = 3;
  bool removed = 4;
  uint64 residence_age_ms = 5;
}

service PeerCenterRpc {
  rpc ReportPeers(ReportPeersRequest) returns (ReportPeersResponse);
  rpc GetGlobalPeerMap(GetGlobalPeerMapRequest)
      returns (GetGlobalPeerMapResponse);
}

message HandshakeRequest {
  uint32 magic = 1;
  uint32 my_peer_id = 2;
  uint32 version = 3;
  repeated string features = 4;
  string network_name = 5;
  bytes network_secret_digest = 6;
}

message KcpConnData {
  common.SocketAddr src = 1;
  common.SocketAddr dst = 4;
}

enum SecureAuthLevel {
  None = 0;
  EncryptedUnauthenticated = 1;
  PeerVerified = 2;
  NetworkSecretConfirmed = 3;
}

enum PeerIdentityType {
  // Same-network administrator with network-secret authority.
  Admin = 0;
  // Credential peer with an administrator-issued credential.
  Credential = 1;
  // Authenticated peer without administrative authority.
  SharedNode = 2;
  // Authenticated foreign-scope relay without local authority.
  ForeignRelay = 3;
}

enum PeerConnDataProtectionPb {
  SessionAead = 0;
  QuicExporter = 1;
}

enum PeerConnSessionActionPb {
  Join = 0;
  Sync = 1;
  Create = 2;
}

message PeerConnNoiseMsg1Pb {
  uint32 version = 1;
  string a_network_name = 2;
  optional uint32 a_session_generation = 3;
  common.UUID a_conn_id = 4;
  string client_encryption_algorithm = 5;
  optional PeerConnNoiseRecoveryPb recovery = 6;
  bytes acknowledged_transition_id = 7;
  // Receive capability mask offered by the initiator.
  uint64 receive_capabilities = 8;
  // Pinned Ed25519 credential-root fingerprint for this network.
  bytes credential_root_fingerprint = 9;
  // SHA-256 digest of the canonical initiator credential certificate.
  bytes initiator_certificate_digest = 10;
  // Transmit capability mask offered by the initiator.
  uint64 transmit_capabilities = 11;
}

message PeerConnNoiseRecoveryPb {
  common.UUID session_metadata_id = 1;
  PeerConnSessionActionPb action = 2;
  uint32 session_generation = 3;
  uint32 initial_epoch = 4;
  bytes root_key_digest = 6;
  reserved 5;
  // Responder-generated opaque transition identity.
  bytes transition_id = 7;
}

message PeerConnNoiseMsg2Pb {
  string b_network_name = 1;
  uint32 role_hint = 2;
  PeerConnSessionActionPb action = 3;
  uint32 b_session_generation = 4;
  // Root keys are delivered only in the authenticated Noise transport Commit.
  reserved 5;
  uint32 initial_epoch = 6;
  common.UUID b_conn_id = 7;
  common.UUID a_conn_id_echo = 8;
  optional bytes secret_proof_32 = 9;
  string server_encryption_algorithm = 10;
  uint32 version = 11;
  common.UUID session_metadata_id = 12;
  optional PeerConnNoiseRecoveryPb recovery = 14;
  reserved 13;
  // Responder-generated opaque transition identity.
  bytes transition_id = 15;
  // Receive capability mask offered by the responder.
  uint64 receive_capabilities = 16;
  // Canonical root-signed responder certificate.
  bytes responder_certificate = 17;
  // Ed25519 credential-root fingerprint used by the certificate.
  bytes credential_root_fingerprint = 18;
  // Bounded root-signed responder certificate status evidence.
  bytes responder_certificate_status = 19;
  // Transmit capability mask offered by the responder.
  uint64 transmit_capabilities = 20;
  // Data protection selected from the typed transport binding.
  PeerConnDataProtectionPb data_protection = 21;
}

message RelayNoiseMsg1Pb {
  uint32 version = 1;
  optional uint32 a_session_generation = 3;
  common.UUID a_conn_id = 4;
  string client_encryption_algorithm = 5;
  optional PeerConnNoiseRecoveryPb recovery = 6;
  bytes acknowledged_transition_id = 7;
}

message RelayNoiseMsg2Pb {
  PeerConnSessionActionPb action = 3;
  uint32 b_session_generation = 4;
  optional bytes root_key_32 = 5;
  uint32 initial_epoch = 6;
  common.UUID b_conn_id = 7;
  common.UUID a_conn_id_echo = 8;
  string server_encryption_algorithm = 10;
  uint32 version = 11;
  bool accepted = 12;
  common.UUID b_session_metadata_id = 14;
  optional PeerConnNoiseRecoveryPb recovery = 15;
  reserved 13;
  // Responder-generated opaque transition identity.
  bytes transition_id = 16;
  // Exact prior responder proof accepted by this authenticated handshake.
  bytes acknowledged_transition_id = 17;
  // Explicit authenticated reset marker for an abandoned initiator transition.
  bool recovery_reset = 18;
}

message PeerConnNoiseMsg3Pb {
  common.UUID a_conn_id_echo = 1;
  common.UUID b_conn_id_echo = 2;
  optional bytes secret_proof_32 = 3;
  bytes secret_digest = 4;
  // Canonical root-signed Credential certificate.
  bytes initiator_certificate = 5;
  // Echo of Msg1 initiator_certificate_digest.
  bytes initiator_certificate_digest = 6;
  // Responder identity accepted by the initiator.
  PeerIdentityType responder_identity_type = 7;
  // Responder authentication accepted by the initiator.
  SecureAuthLevel responder_auth_level = 8;
  // Session protection selected by both peers.
  PeerConnDataProtectionPb data_protection = 9;
}

// The responder sends this message before it commits the session transition.
// Noise transport mode authenticates the complete message.
message PeerConnNoiseCommitPb {
  common.UUID a_conn_id_echo = 1;
  common.UUID b_conn_id_echo = 2;
  common.UUID session_metadata_id = 3;
  PeerConnSessionActionPb action = 5;
  uint32 session_generation = 6;
  uint32 initial_epoch = 7;
  reserved 4;
  bytes transition_id = 8;
  // Session key material is sent only after Msg3 authentication.
  optional bytes root_key_32 = 9;
  // Hash of the complete authenticated admission context.
  bytes admission_context_hash = 10;
}

message PeerConnNoiseCommitAckPb {
  common.UUID a_conn_id_echo = 1;
  common.UUID b_conn_id_echo = 2;
  common.UUID session_metadata_id = 3;
  PeerConnSessionActionPb action = 5;
  uint32 session_generation = 6;
  uint32 initial_epoch = 7;
  reserved 4;
  bytes transition_id = 8;
  // Echo of PeerConnNoiseCommitPb.admission_context_hash.
  bytes admission_context_hash = 10;
}

message PeerConnNoiseCommitDonePb {
  common.UUID a_conn_id_echo = 1;
  common.UUID b_conn_id_echo = 2;
  common.UUID session_metadata_id = 3;
  PeerConnSessionActionPb action = 5;
  uint32 session_generation = 6;
  uint32 initial_epoch = 7;
  reserved 4;
  bytes transition_id = 8;
  // Echo of PeerConnNoiseCommitPb.admission_context_hash.
  bytes admission_context_hash = 10;
}

message PeerConnNoiseReadyPb {
  common.UUID a_conn_id_echo = 1;
  common.UUID b_conn_id_echo = 2;
  common.UUID session_metadata_id = 3;
  PeerConnSessionActionPb action = 5;
  uint32 session_generation = 6;
  uint32 initial_epoch = 7;
  reserved 4;
  bytes transition_id = 8;
  // Echo of the authenticated admission context.
  bytes admission_context_hash = 10;
}

// The responder sends this message before it publishes the session.
message PeerConnNoiseReadyAckPb {
  common.UUID a_conn_id_echo = 1;
  common.UUID b_conn_id_echo = 2;
  common.UUID session_metadata_id = 3;
  PeerConnSessionActionPb action = 5;
  uint32 session_generation = 6;
  uint32 initial_epoch = 7;
  reserved 4;
  bytes transition_id = 8;
  // Echo of the authenticated admission context.
  bytes admission_context_hash = 10;
}

// The initiator confirms that it committed the responder transition.
message PeerConnNoiseReadyReceiptPb {
  common.UUID a_conn_id_echo = 1;
  common.UUID b_conn_id_echo = 2;
  common.UUID session_metadata_id = 3;
  PeerConnSessionActionPb action = 5;
  uint32 session_generation = 6;
  uint32 initial_epoch = 7;
  reserved 4;
  bytes transition_id = 8;
  // Echo of the authenticated admission context.
  bytes admission_context_hash = 10;
}

// The responder confirms receipt of the initiator commit receipt.
message PeerConnNoiseReadyReceiptAckPb {
  common.UUID a_conn_id_echo = 1;
  common.UUID b_conn_id_echo = 2;
  common.UUID session_metadata_id = 3;
  PeerConnSessionActionPb action = 5;
  uint32 session_generation = 6;
  uint32 initial_epoch = 7;
  reserved 4;
  bytes transition_id = 8;
  // Echo of the authenticated admission context.
  bytes admission_context_hash = 10;
}
